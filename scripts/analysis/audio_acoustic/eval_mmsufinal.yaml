# Dedicated baseline configuration for the standalone acoustic-analysis worker.
# The dataset, prompt, generation settings, parser and scorer remain owned by
# lmms_eval/tasks/mmsufinal/mmsufinal.yaml.
experiment:
  name: mmsufinal_audio_acoustic_analysis
  run_id: null
  seed: 42

backbone:
  name: qwen25_omni
  model_path: '${CHECKPOINT_PATH}'
  model_revision: null
  trust_remote_code: false
  config:
    use_audio_in_video: false
    sampling_rate: 16000
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    enable_talker: false

pipeline:
  stages: []

analysis: {}
train: {}

eval:
  backend: lmms_eval
  runtime_mode: default
  compression_mode: none
  target: baseline
  checkpoint_path: '${CHECKPOINT_PATH}'
  tasks: [mmsufinal]
  runtime_batch_size: 1
  num_processes: 4
  distributed_launcher: accelerate
  main_process_port: 29669
  sample_limit: null
  generation: {}
  args:
    use_audio_in_video: false
    log_samples: true
    verbosity: INFO

data:
  dataset_id: null
  dataset_commit: null
  sample_split: test

output:
  run_dir: '${ANALYSIS_RUN_DIR}'
  manifest_path: '${ANALYSIS_RUN_DIR}/manifest.json'

