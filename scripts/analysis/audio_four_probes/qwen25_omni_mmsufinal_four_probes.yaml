# Full original-audio analysis of all 5,000 MMSU-final rows.
# Launch with the run.sh in this directory to also score and build reports.
experiment: {name: qwen25_omni_mmsufinal_four_probes, seed: 42}
backbone:
  name: qwen25_omni
  model_id: Qwen/Qwen2.5-Omni-7B
  trust_remote_code: false
  config:
    torch_dtype: bfloat16
    attn_implementation: eager
    enable_talker: false
pipeline: {stages: []}
analysis:
  backend: lmms_eval
  compression_mode: none
  phase: pre_compression
  tasks: [mmsufinal]
  runtime_batch_size: 1
  sample_limit: null
  probes:
    - name: representation_dynamics
      enabled: true
      layers: all
      metrics: [cosine]
      token_groups: [system, text, audio]
      save_raw: true
    - name: prediction_dynamics
      enabled: true
      layers: all
      top_k: 10
      save_raw: true
    - name: attention_flow
      enabled: true
      layers: all
      token_groups: [system, text, audio]
      layer_batch_size: 1
      mass_conservation_tolerance: 0.002
      save_raw: true
    - name: residual_stream_decomposition
      enabled: true
      layers: all
      causal_layers: all
      causal_operations: [attn, ffn]
      token_groups: [all, system, text, audio]
      collect_residual_stats: true
      ranking_metric: js
      save_raw: true
output:
  run_dir: runs/analysis/audio_four_probes/mmsufinal
  manifest_path: runs/analysis/audio_four_probes/mmsufinal/manifest.json
