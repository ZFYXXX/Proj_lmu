# Target final audio-token retention: 25%; per-audio integer rounding applies.
# Paper integer-stride implementation; candidate support: cpu_contract_verified.
experiment:
  name: unisamp_keep25_mmaunew3
  run_id: null
  seed: 42
backbone:
  name: qwen25_omni
  model_path: ${QWEN25_OMNI_MODEL_PATH}
  model_revision: null
  trust_remote_code: false
  config:
    use_audio_in_video: false
    sampling_rate: 16000
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    enable_talker: false
pipeline:
  stages:
  - name: audio_uniform_sampling
    placement: projector_level
    execution_phase: generate
    plugin: uniform_sampling_audio
    algorithm: uniform_sampling_audio
    variant: uniform_sampling_audio.audio
    binding: uniform_sampling_audio.audio.qwen25_omni
    method: token_compression
    object_family: tensor_slot
    object_subtype: audio_encoder_output_pre_projector
    modalities:
    - audio
    target_modalities:
    - audio
    conditioning_modalities: []
    preserved_modalities:
    - text
    - image
    - video
    coupling_policy: independent
    media_alignment: temporal
    token_roles:
    - observation
    operation:
      type: keep
      target_site: audio_encoder_output_pre_projector
    criterion:
      score_source: uniform_temporal_stride
      sampling_offset: 0
    schedule:
      granularity: per_audio
      compression_factor: 4
      keep_ratio: 0.25
      minimum_keep_tokens: 1
      selector:
        modality: audio
    enabled: true
analysis: {}
train: {}
eval:
  backend: lmms_eval
  runtime_mode: default
  compression_mode: compressed
  target: compressed
  checkpoint_path: ${QWEN25_OMNI_MODEL_PATH}
  tasks:
  - mmaunew3
  runtime_batch_size: 1
  num_processes: 4
  distributed_launcher: accelerate
  main_process_port: 29695
  sample_limit: null
  generation:
    use_cache: true
  args:
    use_audio_in_video: false
    log_samples: true
    verbosity: INFO
data:
  dataset_id: null
  dataset_commit: null
  sample_split: test
output:
  run_dir: ${MLLM_COMP_EVAL_RUN_DIR}
  manifest_path: ${MLLM_COMP_EVAL_RUN_DIR}/manifest.json
