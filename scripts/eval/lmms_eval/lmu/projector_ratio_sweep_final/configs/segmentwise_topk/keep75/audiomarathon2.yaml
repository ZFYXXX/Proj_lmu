# Target final audio-token retention: 75%; per-audio integer rounding applies.
experiment:
  name: segmentwise_topk_keep75_audiomarathon2
  run_id: null
  seed: 42
backbone:
  name: qwen25_omni
  model_path: ${QWEN25_OMNI_MODEL_PATH}
  model_revision: null
  trust_remote_code: false
  config:
    use_audio_in_video: false
    sampling_rate: 16000
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    enable_talker: false
pipeline:
  stages:
  - name: audio_segmentwise_topk
    placement: projector_level
    execution_phase: generate
    plugin: segmentwise_topk_audio
    algorithm: segmentwise_topk_audio
    variant: segmentwise_topk_audio.audio
    binding: segmentwise_topk_audio.audio.qwen25_omni
    enabled: true
    method: token_compression
    object_family: tensor_slot
    object_subtype: audio_encoder_output_pre_projector
    modalities:
    - audio
    target_modalities:
    - audio
    conditioning_modalities: []
    preserved_modalities:
    - text
    - image
    - video
    coupling_policy: independent
    media_alignment: temporal
    token_roles:
    - observation
    operation:
      type: keep
      target_site: audio_encoder_output_pre_projector
    criterion:
      score_source: encoder_last_layer_attention
      num_segments: 10
      random_seed: 42
    schedule:
      granularity: per_audio
      allocation: balanced_exact
      keep_ratio: 0.75
      minimum_keep_tokens: 1
analysis: {}
train: {}
eval:
  backend: lmms_eval
  runtime_mode: default
  compression_mode: compressed
  target: compressed
  checkpoint_path: ${QWEN25_OMNI_MODEL_PATH}
  tasks:
  - audiomarathon2
  runtime_batch_size: 1
  num_processes: 4
  distributed_launcher: accelerate
  main_process_port: 29674
  sample_limit: null
  generation:
    use_cache: true
  args:
    include_path: ${AUDIOMARATHON_TASK_DIR}
    use_audio_in_video: false
    log_samples: true
    verbosity: INFO
data:
  dataset_id: null
  dataset_commit: null
  sample_split: test
output:
  run_dir: ${MLLM_COMP_EVAL_RUN_DIR}
  manifest_path: ${MLLM_COMP_EVAL_RUN_DIR}/manifest.json
