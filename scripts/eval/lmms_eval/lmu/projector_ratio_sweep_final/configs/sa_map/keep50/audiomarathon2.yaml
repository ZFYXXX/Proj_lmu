# Target final audio-token retention: 50%; per-audio integer rounding applies.
# Keep the existing threshold=0.80; grouping must produce at least the requested keep count.
experiment:
  name: sa_map_keep50_audiomarathon2
  run_id: null
  seed: 42
backbone:
  name: qwen25_omni
  model_path: ${QWEN25_OMNI_MODEL_PATH}
  model_revision: null
  trust_remote_code: false
  config:
    use_audio_in_video: false
    sampling_rate: 16000
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    enable_talker: false
pipeline:
  stages:
  - name: audio_sa_map
    placement: projector_level
    execution_phase: generate
    plugin: similarity_attention_merge_prune_audio
    algorithm: similarity_attention_merge_prune_audio
    variant: similarity_attention_merge_prune_audio.audio
    binding: similarity_attention_merge_prune_audio.audio.qwen25_omni
    method: token_compression
    object_family: tensor_slot
    object_subtype: audio_projector_output_post_projector
    modalities:
    - audio
    target_modalities:
    - audio
    conditioning_modalities: []
    preserved_modalities:
    - text
    - image
    - video
    coupling_policy: independent
    media_alignment: temporal
    token_roles:
    - observation
    operation:
      type: merge_prune
      target_site: audio_projector_output_post_projector
      merge_value: attention_weighted_mean
    criterion:
      score_source: encoder_penultimate_layer_attention
      similarity_threshold: 0.8
      pruning: greedy_attention_dpp
      attention_power: 1.0
    schedule:
      keep_ratio: 0.5
      minimum_keep_tokens: 1
    enabled: true
analysis: {}
train: {}
eval:
  backend: lmms_eval
  runtime_mode: default
  compression_mode: compressed
  target: compressed
  checkpoint_path: ${QWEN25_OMNI_MODEL_PATH}
  tasks:
  - audiomarathon2
  runtime_batch_size: 1
  num_processes: 4
  distributed_launcher: accelerate
  main_process_port: 29724
  sample_limit: null
  generation:
    use_cache: true
  args:
    include_path: ${AUDIOMARATHON_TASK_DIR}
    use_audio_in_video: false
    log_samples: true
    verbosity: INFO
data:
  dataset_id: null
  dataset_commit: null
  sample_split: test
output:
  run_dir: ${MLLM_COMP_EVAL_RUN_DIR}
  manifest_path: ${MLLM_COMP_EVAL_RUN_DIR}/manifest.json
