# UnSeg: natural local peaks determine the output count; no fixed keep_ratio.
# Candidate support: cpu_contract_verified; requires Qwen preflight audio-encoder execution.
experiment:
  name: unseg_natural_mmau_pro
  run_id: null
  seed: 42
backbone:
  name: qwen25_omni
  model_path: ${QWEN25_OMNI_MODEL_PATH}
  model_revision: null
  trust_remote_code: false
  config:
    use_audio_in_video: false
    sampling_rate: 16000
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    enable_talker: false
pipeline:
  stages:
  - name: audio_unsupervised_segmentation
    placement: projector_level
    execution_phase: generate
    plugin: unsupervised_segmentation_audio
    algorithm: unsupervised_segmentation_audio
    variant: unsupervised_segmentation_audio.audio
    binding: unsupervised_segmentation_audio.audio.qwen25_omni
    method: token_compression
    object_family: tensor_slot
    object_subtype: audio_encoder_output_pre_projector
    modalities:
    - audio
    target_modalities:
    - audio
    conditioning_modalities: []
    preserved_modalities:
    - text
    - image
    - video
    coupling_policy: independent
    media_alignment: temporal
    token_roles:
    - observation
    operation:
      type: merge
      target_site: audio_encoder_output_pre_projector
      merge_value: mean
    criterion:
      score_source: adjacent_token_cosine_dissimilarity
      boundary_detector: strict_local_peak
    schedule:
      granularity: per_audio
      budget_policy: natural_peaks
      minimum_keep_tokens: 1
      selector:
        modality: audio
    enabled: true
analysis: {}
train: {}
eval:
  backend: lmms_eval
  runtime_mode: default
  compression_mode: compressed
  target: compressed
  checkpoint_path: ${QWEN25_OMNI_MODEL_PATH}
  tasks:
  - mmau_pro
  runtime_batch_size: 1
  distributed_launcher: accelerate
  main_process_port: 29804
  sample_limit: null
  generation: {}
  args:
    force_simple: true
    use_audio_in_video: false
    log_samples: true
    verbosity: INFO
data:
  dataset_id: null
  dataset_commit: null
  sample_split: test
output:
  run_dir: ${MLLM_COMP_EVAL_RUN_DIR}
  manifest_path: ${MLLM_COMP_EVAL_RUN_DIR}/manifest.json
