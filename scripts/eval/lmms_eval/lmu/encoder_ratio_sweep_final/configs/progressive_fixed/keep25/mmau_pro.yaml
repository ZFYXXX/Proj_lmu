# Target final audio-token retention: 25%; layer/chunk rounding changes the realized ratio.
# Fixed per-stage pruning at zero-based layers [6, 12, 18].
experiment:
  name: progressive_fixed_keep25_mmau_pro
  run_id: null
  seed: 42
backbone:
  name: qwen25_omni
  model_path: ${QWEN25_OMNI_MODEL_PATH}
  model_revision: null
  trust_remote_code: false
  config:
    use_audio_in_video: false
    sampling_rate: 16000
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    enable_talker: false
pipeline:
  stages:
    - name: audio_progressive_attention_pruning
      placement: encoder_level
      execution_phase: generate
      plugin: progressive_attention_pruning_audio
      algorithm: progressive_attention_pruning_audio
      variant: progressive_attention_pruning_audio.audio
      binding: progressive_attention_pruning_audio.audio.qwen25_omni
      method: token_compression
      object_family: tensor_slot
      object_subtype: audio_encoder_layer_output_post_block
      modalities:
        - audio
      target_modalities:
        - audio
      conditioning_modalities: []
      preserved_modalities:
        - text
        - image
        - video
      coupling_policy: independent
      media_alignment: temporal
      token_roles:
        - observation
      operation:
        type: keep
        target_site: audio_encoder_layer_output_post_block
      criterion:
        score_source: mean_received_self_attention
      schedule:
        policy: fixed
        pruning_rate: 0.36
        minimum_keep_tokens: 2
      activation_scope:
        layers:
          - 6
          - 12
          - 18
      enabled: true
analysis: {}
train: {}
eval:
  backend: lmms_eval
  runtime_mode: default
  compression_mode: compressed
  target: compressed
  checkpoint_path: ${QWEN25_OMNI_MODEL_PATH}
  tasks:
    - mmau_pro
  runtime_batch_size: 1
  distributed_launcher: accelerate
  main_process_port: 29731
  sample_limit: null
  generation: {}
  args:
    force_simple: true
    use_audio_in_video: false
    log_samples: true
    verbosity: INFO
data:
  dataset_id: null
  dataset_commit: null
  sample_split: test
output:
  run_dir: ${MLLM_COMP_EVAL_RUN_DIR}
  manifest_path: ${MLLM_COMP_EVAL_RUN_DIR}/manifest.json
