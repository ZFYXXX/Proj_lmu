# Target final audio-token retention: 75%; layer/chunk rounding changes the realized ratio.
# Per-stage TopK retention at zero-based layers [3, 6, 9].
experiment:
  name: encoder_topk_keep75_mmarfinal
  run_id: null
  seed: 42
backbone:
  name: qwen25_omni
  model_path: ${QWEN25_OMNI_MODEL_PATH}
  model_revision: null
  trust_remote_code: false
  config:
    use_audio_in_video: false
    sampling_rate: 16000
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    enable_talker: false
pipeline:
  stages:
    - name: audio_encoder_attention_topk
      placement: encoder_level
      execution_phase: generate
      plugin: encoder_attention_topk_audio
      algorithm: encoder_attention_topk_audio
      variant: encoder_attention_topk_audio.audio
      binding: encoder_attention_topk_audio.audio.qwen25_omni
      method: token_compression
      object_family: tensor_slot
      object_subtype: audio_encoder_layer_post_mhsa_pre_ffn
      modalities:
        - audio
      target_modalities:
        - audio
      conditioning_modalities: []
      preserved_modalities:
        - text
        - image
        - video
      coupling_policy: independent
      media_alignment: temporal
      token_roles:
        - observation
      operation:
        type: keep
        target_site: audio_encoder_layer_post_mhsa_pre_ffn
      criterion:
        score_source: mean_received_self_attention
      schedule:
        keep_ratio: 0.915
        minimum_keep_tokens: 2
      activation_scope:
        layers:
          - 3
          - 6
          - 9
      enabled: true
analysis: {}
train: {}
eval:
  backend: lmms_eval
  runtime_mode: default
  compression_mode: compressed
  target: compressed
  checkpoint_path: ${QWEN25_OMNI_MODEL_PATH}
  tasks:
    - mmarfinal
  runtime_batch_size: 1
  num_processes: 4
  distributed_launcher: accelerate
  main_process_port: 29637
  sample_limit: null
  generation:
    use_cache: true
  args:
    use_audio_in_video: false
    log_samples: true
    verbosity: INFO
data:
  dataset_id: null
  dataset_commit: null
  sample_split: test
output:
  run_dir: ${MLLM_COMP_EVAL_RUN_DIR}
  manifest_path: ${MLLM_COMP_EVAL_RUN_DIR}/manifest.json
