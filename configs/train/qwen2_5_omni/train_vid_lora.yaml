experiment:
  name: train_vid_lora
  seed: 42

backbone:
  name: qwen25_omni
  model_path: '${QWEN25_OMNI_MODEL_PATH}'
  trust_remote_code: false
  config:
    use_audio_in_video: false
    video_max_pixels: 100352
    fps: 2.0
    fps_min_frames: 4
    fps_max_frames: 12
    frame_factor: 2

train:
  backend: ms_swift
  compression_mode: none
  max_steps: null
  args:
    datasets: ['${MLLM_COMP_TRAIN_DATASET}']
    trainable_branch: thinker
    enable_audio_output: false
    tuner_type: lora
    lora_rank: 8
    lora_alpha: 32
    target_modules: [all-linear]
    freeze_llm: false
    freeze_vit: true
    freeze_aligner: true
    torch_dtype: bfloat16
    max_length: 4096
    learning_rate: 0.0001
    num_train_epochs: 1
    per_device_train_batch_size: 16
    per_device_eval_batch_size: 16
    gradient_accumulation_steps: 4
    warmup_ratio: 0.05
    split_dataset_ratio: 0.01
    eval_steps: 100
    save_steps: 100
    save_total_limit: 2
    load_from_cache_file: true
    dataset_num_proc: 4
    dataloader_num_workers: 4
    deepspeed: zero2
    logging_steps: 5
    report_to: [wandb]
    run_name: video_lora

data:
  dataset_id: '${MLLM_COMP_TRAIN_DATASET}'
  sample_split: train

output:
  run_dir: '${MLLM_COMP_TRAIN_RUN_DIR}'
  manifest_path: '${MLLM_COMP_TRAIN_RUN_DIR}/manifest.json'

