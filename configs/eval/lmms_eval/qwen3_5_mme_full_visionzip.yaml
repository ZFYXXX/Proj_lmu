experiment:
  name: qwen3_5_mme_full_visionzip
  run_id: null
  seed: 42

backbone:
  name: qwen3_5
  model_path: ${QWEN3_5_MODEL_PATH}
  model_revision: null
  trust_remote_code: false
  config:
    torch_dtype: auto
    attn_implementation: sdpa
    model_load_kwargs: {local_files_only: true, device_map: auto}
    processor_load_kwargs: {local_files_only: true}

pipeline:
  stages:
    - name: visionzip_qwen3_5_image_features
      enabled: true
      placement: projector_level
      execution_phase: generate
      plugin: visionzip
      algorithm: visionzip
      variant: visionzip.image.projector_feature
      binding: visionzip.image.qwen3_5
      method: token_compression
      object_family: tensor_slot
      object_subtype: image_feature
      modalities: [image]
      conditioning_modalities: []
      preserved_modalities: [text, video, audio]
      coupling_policy: independent
      media_alignment: spatial
      operation: {type: merge}
      criterion: {score_source: final_visual_mean_received_attention}
      schedule: {granularity: per_image}
      config: {retain_ratio: 0.5, target_count: null, attention_chunk_size: 128}

analysis: {}
train: {}

eval:
  backend: lmms_eval
  compression_mode: compressed
  target: compressed
  checkpoint_path: ${QWEN3_5_MODEL_PATH}
  tasks: [mme_local_full]
  runtime_batch_size: 1
  num_processes: 1
  sample_limit: null
  generation: {max_new_tokens: 16, temperature: 0.0, do_sample: false, use_cache: true}
  args: {force_simple: true, log_samples: true, include_path: configs/eval/lmms_eval/tasks/mme_local_full}

data: {dataset_id: MME-local-full, sample_split: test}
output:
  run_dir: outputs/qwen3_5-eval/full-visionzip-20261012/mme
  manifest_path: outputs/qwen3_5-eval/full-visionzip-20261012/mme/manifest.json
