experiment:
  name: qwen25_omni_mmau_pro_1gpu
  run_id: null
  seed: 42

backbone:
  name: qwen25_omni
  model_path: ${QWEN25_OMNI_MODEL_PATH}
  model_revision: null
  trust_remote_code: false
  config:
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    enable_talker: false

pipeline:
  stages: []

analysis: {}
train: {}

eval:
  backend: lmms_eval
  runtime_mode: default
  compression_mode: none
  target: baseline
  checkpoint_path: ${QWEN25_OMNI_MODEL_PATH}
  tasks: [mmau_pro]
  runtime_batch_size: 1
  num_processes: 1
  distributed_launcher: accelerate
  generation:
    until: []
    temperature: 0.0
    use_cache: true
  args:
    force_simple: true
    use_audio_in_video: false
    log_samples: true
    verbosity: INFO
    cache_requests: refresh

data:
  dataset_id: mmau_pro
  dataset_commit: null
  sample_split: test
