experiment:
  name: qwen25_omni_lmms_eval
  run_id: null
  seed: 42

backbone:
  name: qwen25_omni
  model_path: ${QWEN25_OMNI_MODEL_PATH}
  model_revision: null
  trust_remote_code: false
  config:
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    enable_talker: false

pipeline:
  stages: []

analysis: {}
train: {}

eval:
  backend: lmms_eval
  compression_mode: none
  target: baseline
  checkpoint_path: ${QWEN25_OMNI_MODEL_PATH}
  tasks: [mme]
  runtime_batch_size: 1
  generation:
    max_new_tokens: 128
    do_sample: false
    temperature: 0.0
  args:
    use_audio_in_video: false
    log_samples: true

data:
  dataset_id: mme
  dataset_commit: null
  sample_split: validation
