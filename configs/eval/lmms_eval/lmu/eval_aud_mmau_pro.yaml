experiment:
  name: lmu_eval_aud_mmau_pro
  run_id: null
  seed: 42

backbone:
  name: qwen25_omni
  model_path: '${QWEN25_OMNI_MODEL_PATH}'
  model_revision: null
  trust_remote_code: false
  config:
    use_audio_in_video: false
    sampling_rate: 16000
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    enable_talker: false

pipeline:
  stages: []

analysis: {}
train: {}

eval:
  backend: lmms_eval
  runtime_mode: default
  compression_mode: none
  target: baseline
  checkpoint_path: '${QWEN25_OMNI_MODEL_PATH}'
  tasks: [mmau_pro]
  runtime_batch_size: 1
  distributed_launcher: accelerate
  main_process_port: 29731
  sample_limit: null
  generation: {}
  args:
    force_simple: true
    use_audio_in_video: false
    log_samples: true
    verbosity: INFO

data:
  dataset_id: null
  dataset_commit: null
  sample_split: test

output:
  run_dir: '${MLLM_COMP_EVAL_RUN_DIR}'
  manifest_path: '${MLLM_COMP_EVAL_RUN_DIR}/manifest.json'
