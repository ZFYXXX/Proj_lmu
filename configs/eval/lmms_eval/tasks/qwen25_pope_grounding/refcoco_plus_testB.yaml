  - {metric: refcoco_ACC@0.5, aggregation: !function grounding_utils.acc05, higher_is_better: true}
  - {metric: refcoco_ACC@0.7, aggregation: !function grounding_utils.acc07, higher_is_better: true}
  - {metric: refcoco_ACC@0.9, aggregation: !function grounding_utils.acc09, higher_is_better: true}
  - {metric: refcoco_Center_ACC, aggregation: !function grounding_utils.center_acc, higher_is_better: true}
metadata: {version: 1.0}
