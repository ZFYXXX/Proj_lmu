task: refcoco+_bbox_rec_testB_local
dataset_path: parquet
dataset_kwargs:
  data_files:
    testB:
      - /home/YinPeiran/datasets/lmms_eval_datasets/RefCOCOplus/data/testB-00000-of-00001.parquet
test_split: testB
process_docs: !function grounding_utils.process_docs
output_type: generate_until
doc_to_visual: !function grounding_utils.doc_to_visual
doc_to_text: !function grounding_utils.doc_to_text
