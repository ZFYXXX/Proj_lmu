experiment:
  name: qwen25_vl_prediction_dynamics_example
  seed: 42

backbone:
  name: qwen25_vl
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  model_revision: 66285546d2b821cf421d4f5eb2576359d3770cd3
  trust_remote_code: false
  config:
    torch_dtype: bfloat16
    attn_implementation: eager

pipeline:
  stages: []

analysis:
  backend: lmms_eval
  compression_mode: none
  phase: pre_compression
  tasks: [mme]
  runtime_batch_size: 1
  sample_limit: 1
  probes:
    - name: prediction_dynamics
      enabled: true
      layers: [0]
      metrics: [js, top1_matches_final, rank_of_final_top1]
      top_k: 10
      save_raw: false
