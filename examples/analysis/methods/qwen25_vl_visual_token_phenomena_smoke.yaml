experiment:
  name: qwen25_vl_visual_token_phenomena_smoke
  seed: 42

backbone:
  name: qwen25_vl
  model_path: /home/ZhouFengyu/fastv-repro/models/Qwen2.5-VL-3B-Instruct
  model_revision: 1b5a7674d40a0ac9acef541a46fed12d710bd36b
  trust_remote_code: false
  config:
    torch_dtype: bfloat16
    attn_implementation: eager
    device: cuda:0
    model_load_kwargs: {local_files_only: true}
    processor_load_kwargs:
      local_files_only: true
      use_fast: false
      min_pixels: 200704
      max_pixels: 1605632

pipeline: {stages: []}

analysis:
  backend: lmms_eval
  compression_mode: none
  phase: pre_compression
  runtime_batch_size: 1
  tasks: [chartqa]
  task_include_path: [/home/ZhouFengyu/fastv-repro/lmms_eval/tasks]
  streaming_datasets: true
  sample_limit: 1
  probes:
    - name: visual_token_phenomena
      enabled: true
      layers: [0]
      intervention_layer: 0
      target_units: 64
      max_intervention_units: 2
      interventions: [zero, global_mean]
      random_seeds: [11, 23, 47]
      run_causal_interventions: true
      run_budget_frontier: true
      run_layer_trajectory: false
      # ChartQA sample 0 has 630 source tokens; K630 is an identity gate for
      # the compact Decoder-suffix path and is skipped on shorter samples.
      budgets: [64, 630]
      compression_operators: [prune, representative, cluster_mean, attention_weighted_merge]
      safe_nll_relative_limit: 0.05
      safe_kl_limit: 0.05
      spatial_bins: 4
      save_raw: true

train: {}
eval: {}
data: {}
output: {}
