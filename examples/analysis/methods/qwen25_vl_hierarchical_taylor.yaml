experiment:
  name: qwen25_vl_hierarchical_taylor_example
  seed: 42

backbone:
  name: qwen25_vl
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  model_revision: 66285546d2b821cf421d4f5eb2576359d3770cd3
  trust_remote_code: false
  config:
    torch_dtype: bfloat16
    # Path Taylor 需要精确 Attention 权重。
    attn_implementation: eager

pipeline:
  stages: []

analysis:
  backend: lmms_eval
  compression_mode: none
  phase: pre_compression
  tasks: [mme]
  runtime_batch_size: 1
  sample_limit: 1
  probes:
    - name: hierarchical_taylor
      enabled: true
      layers: [0]
      layer_batch_size: 1
      objective: teacher_forced_answer_cross_entropy_v1
      ffn_bottom_fraction: 0.3
      causal_validation:
        enabled: true
        component_count: 1
        # 单层 smoke 无法为 Whole Layer 构造另一层 matched control。
        kinds: [path, head, ffn_neuron, sublayer]
        seed: 42
      save_raw: false
