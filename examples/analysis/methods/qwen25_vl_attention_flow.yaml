experiment:
  name: qwen25_vl_attention_flow_example
  seed: 42

backbone:
  name: qwen25_vl
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  model_revision: 66285546d2b821cf421d4f5eb2576359d3770cd3
  trust_remote_code: false
  config:
    torch_dtype: bfloat16
    # Attention Flow 必须读取精确 Attention 权重。
    attn_implementation: eager

pipeline:
  stages: []

analysis:
  backend: lmms_eval
  compression_mode: none
  phase: pre_compression
  tasks: [mme]
  runtime_batch_size: 1
  sample_limit: 1
  probes:
    - name: attention_flow
      enabled: true
      layers: [0]
      metrics:
        - text_to_vision_mass
        - decision_to_vision_mass
        - decision_to_vision_entropy_norm
      token_groups: [system, text, vision]
      layer_batch_size: 1
      mass_conservation_tolerance: 0.002
      save_raw: false
