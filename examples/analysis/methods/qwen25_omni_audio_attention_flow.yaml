experiment: {name: qwen25_omni_audio_attention_flow_example, seed: 42}
backbone:
  name: qwen25_omni
  model_id: Qwen/Qwen2.5-Omni-3B
  model_revision: null
  trust_remote_code: false
  config: {torch_dtype: bfloat16, attn_implementation: eager, enable_talker: false}
pipeline: {stages: []}
analysis:
  backend: lmms_eval
  compression_mode: none
  phase: pre_compression
  tasks: [mmau_test_mini]
  runtime_batch_size: 1
  sample_limit: 1
  probes:
    - name: attention_flow
      enabled: true
      layers: [0]
      metrics: [text_to_audio_mass, decision_to_audio_mass, decision_to_audio_entropy_norm]
      token_groups: [system, text, audio]
      layer_batch_size: 1
      mass_conservation_tolerance: 0.002
      save_raw: false
