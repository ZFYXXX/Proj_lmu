experiment:
  # 实验名称用于默认输出目录；每次运行会生成独立 run_id。
  name: qwen25_vl_representation_dynamics_example
  seed: 42

backbone:
  name: qwen25_vl
  # 可共享配置保留模型 ID；本地运行可用 --checkpoint 覆盖。
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  # 固定 revision，避免远端 main 更新后结果发生变化。
  model_revision: 66285546d2b821cf421d4f5eb2576359d3770cd3
  trust_remote_code: false
  config:
    torch_dtype: bfloat16
    attn_implementation: eager

pipeline:
  # 空 stages 表示分析未压缩的 baseline。
  stages: []

analysis:
  backend: lmms_eval
  compression_mode: none
  phase: pre_compression
  tasks: [mme]
  runtime_batch_size: 1
  # 本示例只处理一个样本，并在下方 Probe 中只选择第 0 层。
  sample_limit: 1
  probes:
    - name: representation_dynamics
      enabled: true
      layers: [0]
      metrics: [cosine]
      collect_points: [before_attn, attn_only, after_attn, ffn_only, after_ffn]
      token_groups: [system, text, vision]
      save_raw: false
