experiment: {name: qwen25_omni_audio_residual_stream_decomposition_example, seed: 42}
backbone:
  name: qwen25_omni
  model_id: Qwen/Qwen2.5-Omni-3B
  model_revision: null
  trust_remote_code: false
  config: {torch_dtype: bfloat16, attn_implementation: eager, enable_talker: false}
pipeline: {stages: []}
analysis:
  backend: lmms_eval
  compression_mode: none
  phase: pre_compression
  tasks: [mmau_test_mini]
  runtime_batch_size: 1
  sample_limit: 1
  probes:
    - name: residual_stream_decomposition
      enabled: true
      layers: [0]
      causal_layers: [0]
      causal_operations: [attn, ffn]
      token_groups: [all, system, text, audio]
      metrics: [update_norm, residual_ratio, cosine_to_input, js, changed_prob_on_base_top1, top1_changed]
      ranking_metric: js
      collect_residual_stats: true
      save_raw: false
