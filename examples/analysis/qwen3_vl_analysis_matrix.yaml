experiment:
  name: qwen3_vl_analysis_matrix_smoke
  seed: 42

backbone:
  name: qwen3_vl
  model_id: Qwen/Qwen3-VL-2B-Instruct
  model_revision: 89644892e4d85e24eaac8bacfd4f463576704203
  trust_remote_code: false
  config:
    torch_dtype: bfloat16
    attn_implementation: eager

pipeline:
  stages: []

analysis:
  backend: lmms_eval
  compression_mode: none
  phase: pre_compression
  tasks: [mme]
  runtime_batch_size: 1
  sample_limit: 1
  probes:
    - name: representation_dynamics
      enabled: true
      layers: [0]
      save_raw: false
    - name: layer_importance
      enabled: true
      layers: [0]
      operations: [layer, attn, ffn]
      target_token_types: [vision]
      attn_edges: [v2v, v2t, t2v, t2t]
      save_raw: false
    - name: late_injection_early_exit
      enabled: true
      layers: [0]
      experiment_types: [early_exit, late_injection]
      save_raw: false
    - name: residual_stream_decomposition
      enabled: true
      layers: [0]
      causal_layers: [0]
      causal_operations: [attn, ffn]
      save_raw: false
    - name: prediction_dynamics
      enabled: true
      layers: [0]
      top_k: 10
      save_raw: false
    - name: attention_flow
      enabled: true
      layers: [0]
      layer_batch_size: 1
      save_raw: false
    - name: hierarchical_taylor
      enabled: true
      layers: [0]
      layer_batch_size: 1
      ffn_bottom_fraction: 0.3
      causal_validation:
        enabled: true
        component_count: 1
        kinds: [path, head, ffn_neuron, sublayer, layer]
        seed: 42
      save_raw: false
