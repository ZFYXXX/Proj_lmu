# Run from the repository root. Replace the model and Swift dataset paths.
experiment:
  name: first_k_audio
  seed: 42
backbone:
  name: qwen25_omni
  model_path: ${QWEN25_OMNI_MODEL_PATH}
pipeline:
  extensions: [examples.compression_extensions.first_k_audio:register]
  stages:
    - name: reduce_audio
      algorithm: researcher_first_k_audio
      execution_phase: forward
      config:
        keep_ratio: 0.5
train:
  backend: ms_swift
  compression_mode: compressed
  max_steps: 2
  args:
    datasets: ['${MLLM_COMP_TRAIN_DATASET}']
    tuner_type: full
    torch_dtype: bfloat16
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    gradient_checkpointing: true
    save_steps: 1
    save_only_model: false
    split_dataset_ratio: 0
    report_to: [none]
